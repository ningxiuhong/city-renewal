<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>城市更新政策资金 · 五大渠道交互图谱</title>
<style>
:root{
  --line:#e2e7f1; --paper:#ffffff; --ink:#222b3f; --mut:#68738a; --bg:#edf1f8;
  --c-dept:#4a5f8f; --c-scope:#0e7c78; --c-amt:#b03a2e; --c-feat:#7a54a3; --c-req:#3b7a4e; --c-opt:#8a6d3b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:14px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#f8fafd 0,#edf1f8 340px,#edf1f8 100%) fixed;}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px 56px}

/* ---------- 顶栏 ---------- */
header.mast{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;justify-content:space-between;
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 28px;margin:22px 0 14px;
  box-shadow:0 8px 26px rgba(30,50,90,.07)}
header.mast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,#c62828,#b7791f,#1f6fb2,#2e7d32,#6a4fa3)}
header.mast::after{content:"";position:absolute;right:-70px;top:-80px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(31,111,178,.10),transparent 70%);pointer-events:none}
.mastl{position:relative;z-index:1}
.kick{font-size:11.5px;letter-spacing:2.5px;color:#9aa3b5;font-weight:600;margin-bottom:4px}
h1{margin:0;font-size:27px;line-height:1.3;font-weight:800;letter-spacing:.3px}
h1 b{color:#c62828;font-weight:800}
.lead{margin:7px 0 0;font-size:13.5px;color:#55607a}
.lead b{color:#313c57}
.mastr{position:relative;z-index:1;flex:none;text-align:right;font-size:12px;color:#8b95a9;line-height:2}
.mastr b{display:block;font-size:16px;color:#2a3350}

/* ---------- 导航 ---------- */
nav.pills{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 2px;margin:2px 0 14px;border-radius:16px}
.pill{appearance:none;border:1px solid #d8deea;background:#fff;color:#3a4459;cursor:pointer;
  padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;font-family:inherit;
  box-shadow:0 1px 3px rgba(25,40,80,.06);transition:transform .12s,box-shadow .12s,background .12s;user-select:none}
.pill:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(25,40,80,.13)}
.pill:active{transform:translateY(0)}
.pill.on{color:#fff;box-shadow:0 6px 16px rgba(25,40,80,.20)}
.pill .dot{display:none}

section.view{display:none}
section.view.on{display:block;animation:fv .2s ease}
@keyframes fv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 通用卡片 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 3px 12px rgba(20,40,80,.05)}
.card h4{margin:0 0 10px;font-size:15px;color:#2a3350;display:flex;align-items:center;gap:8px}
.tip{background:#f7f9ff;border:1px dashed #c6d0e6;border-radius:12px;padding:8px 14px;color:#4d5872;font-size:12.5px;margin-top:12px}
.tip b{color:#2a3350}

/* ---------- 总览 KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:2px 0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;position:relative;overflow:hidden;
  box-shadow:0 3px 10px rgba(20,40,80,.05)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--cc)}
.kpi .ic{font-size:21px;position:absolute;right:14px;top:12px;opacity:.9}
.kpi .nm{font-size:12.5px;font-weight:700;color:#3a4459;margin-top:4px}
.kpi .num{display:block;font-size:25px;font-weight:800;color:var(--cc);letter-spacing:.3px;line-height:1.25}
.kpi .cap{display:block;font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.55}

.ovgrid{display:grid;grid-template-columns:1.18fr .82fr;gap:14px;align-items:stretch}
@media (max-width:900px){.ovgrid{grid-template-columns:1fr}}

/* ---------- 总览 渠道一览 ---------- */
.legend{display:flex;flex-direction:column}
.lrow{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-bottom:1px dashed #eef1f7}
.lrow:last-child{border-bottom:none}
.lrow i{flex:none;width:11px;height:11px;border-radius:50%;margin-top:7px;box-shadow:0 0 0 4px rgba(20,40,80,.05)}
.lrow b{font-size:14px;color:#2a3350}
.lrow p{margin:1px 0 0;font-size:12px;color:var(--mut);line-height:1.55}

.hubwrap{background:linear-gradient(180deg,#fbfcff,#f5f8fd);border:1px solid var(--line);border-radius:14px;padding:6px}
.hubwrap svg{width:100%;height:auto;display:block}

/* ---------- 渠道页 ---------- */
.cband{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-left:6px solid var(--cc);border-radius:16px;padding:16px 20px;box-shadow:0 3px 12px rgba(20,40,80,.05)}
.cbicon{flex:none;width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px}
.cbt{flex:1;min-width:230px}
.cbt h2{margin:0;font-size:22px;font-weight:800}
.ctag{margin:2px 0 0;font-size:13px;color:var(--mut)}
.cbmini{flex:none;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff}
.csub{margin:12px 0 0;padding:10px 14px;background:#fbfcfe;border:1px dashed var(--line);border-radius:12px;
  color:#44506c;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px;margin:13px 0 6px}
.fact{background:#fff;border:1px solid var(--line);border-left:3px solid var(--cc);border-radius:10px;padding:7px 12px;
  box-shadow:0 1px 5px rgba(20,40,80,.04)}
.fk{display:block;font-size:11px;color:var(--mut);letter-spacing:.6px;font-weight:600}
.fv{display:block;font-size:12.5px;font-weight:700;color:#2a3350;margin-top:1px}

.flowcap{margin:14px 2px 6px;font-size:12px;font-weight:700;color:#4d5872;letter-spacing:.5px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(20,40,80,.04)}
.fnode{background:#f5f7fb;border:1px solid #d7deec;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#3c475e}
.fnode.fin{color:#fff}
.farr{color:#aab4c8;font-weight:800;margin:0 1px;font-size:13px}

/* ---------- 政策卡 ---------- */
.grib{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0 2px;padding:12px 16px 10px 0;border-bottom:2px solid var(--cc,var(--line))}
.gb{flex:none;width:30px;height:30px;border-radius:50%;background:var(--cc,var(--ink));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.gtx b{font-size:17px;color:#2a3350}
.gtx .gt{margin-left:10px;font-size:12.5px;color:var(--mut)}
.gcount{margin-left:auto;font-size:11.5px;color:#8b95a9;background:#f0f3f9;border:1px solid var(--line);padding:2px 10px;border-radius:999px;font-weight:600}

.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0;
  box-shadow:0 4px 14px rgba(20,40,80,.05)}
.pch{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pico{flex:none;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:27px}
.ptxt{flex:1;min-width:250px}
.ptxt h3{margin:0;font-size:17.5px;font-weight:800;color:#1f2840;display:inline;line-height:1.4}
.ptxt .num{display:inline-block;vertical-align:3px;font-size:11.5px;color:#5f6a83;background:#f1f3f9;border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;font-weight:600;font-family:ui-monospace,Consolas,"Courier New",monospace;margin-left:8px;white-space:nowrap}
.off{margin:4px 0 8px;font-size:12px;color:var(--mut);line-height:1.6}
.kws{margin-top:6px}
.kw{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;margin:2px 6px 2px 0;color:#33405c}
.pamt{flex:none;min-width:150px;max-width:255px;text-align:left;border-radius:14px;padding:10px 14px;margin-left:auto}
.pamt .lbl{display:block;font-size:10.5px;letter-spacing:1.5px;color:#8892a8;font-weight:700}
.pamt .big{display:block;font-size:15.5px;font-weight:800;line-height:1.4;margin-top:2px}
.pamt .note2{display:block;font-size:11px;color:#8b95a9;margin-top:2px;line-height:1.5}
@media (max-width:760px){.pamt{margin-left:0;max-width:100%}}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;margin-top:14px}
.dim{border:1px solid var(--line);border-top:3px solid var(--line);border-radius:12px;background:#fdfdff;overflow:hidden}
.dim .dh{display:flex;align-items:center;gap:7px;padding:7px 12px 6px;font-size:11.5px;font-weight:800;letter-spacing:1px;
  border-bottom:1px solid #eef1f6;background:#f7f9fd;color:#5a6a8f}
.dim .dh .i2{font-size:13px}
.dim .dc{padding:8px 12px 10px;font-size:13px;color:#333e55;line-height:1.8}
.d-dept{border-top-color:var(--c-dept)} .d-dept .dh{color:var(--c-dept)}
.d-scope{border-top-color:var(--c-scope)} .d-scope .dh{color:var(--c-scope)}
.d-amt{border-top-color:var(--c-amt)} .d-amt .dh{color:var(--c-amt)}
.d-feat{border-top-color:var(--c-feat)} .d-feat .dh{color:var(--c-feat)}
.d-req{border-top-color:var(--c-req)} .d-req .dh{color:var(--c-req)}
.d-opt{border-top-color:var(--c-opt)} .d-opt .dh{color:var(--c-opt)}
.dim .dc b,.dim .dc strong{color:#b03a2e;font-weight:800}

.pnote{margin-top:12px;border:1px solid #ece0d8;border-left:4px solid var(--cc,var(--c-amt));background:#fdf9f5;border-radius:0 10px 10px 0;
  padding:8px 12px;font-size:12.5px;color:#5c4a3c;line-height:1.75}
.pnote .lb{font-weight:800;color:#8a5a2a}

/* ---------- 矩阵 ---------- */
.mxhead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:0 0 12px;box-shadow:0 3px 10px rgba(20,40,80,.05)}
.mxhead h4{margin:0;font-size:16px}
.mxhead p{margin:4px 0 0;font-size:12.5px;color:var(--mut)}
.mx{background:#fff;border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:0 3px 12px rgba(20,40,80,.05)}
.mxh{display:flex;gap:12px;align-items:center;padding:13px 18px;background:linear-gradient(90deg,#fbfcff,#fff);border-bottom:1px solid var(--line);border-left:6px solid var(--cc)}
.mxh h3{margin:0;font-size:16.5px;font-weight:800;color:#222b3f}
.mxshort{margin:0;padding:10px 18px 2px;font-size:12px;color:var(--mut);line-height:1.7}
.mxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:2px;padding:6px 10px 12px}
.mxc{padding:8px 10px;border-radius:8px}
.mxc:nth-child(odd){background:#fafbfe}
.mxc .mkl{font-size:11px;font-weight:800;letter-spacing:.6px;color:#5a6a8f;display:block;margin-bottom:2px}
.d-dept .mkl{color:var(--c-dept)} .d-scope .mkl{color:var(--c-scope)} .d-amt .mkl{color:var(--c-amt)}
.d-feat .mkl{color:var(--c-feat)} .d-req .mkl{color:var(--c-req)} .d-opt .mkl{color:var(--c-opt)}
.mxc .mv{font-size:12.5px;color:#333e55;line-height:1.75}
.maxtips{margin-top:14px}
.maxtips li{list-style:none;position:relative;padding:4px 0 4px 30px;font-size:13px;color:#44506c;line-height:1.7}
.maxtips li::before{content:"💡";position:absolute;left:2px;top:4px;font-size:15px}

/* ---------- 项目申报指引 ---------- */
.gcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 4px 16px rgba(20,40,80,.06)}
.ghead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.ghead .gi{flex:none;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:27px;background:linear-gradient(135deg,#e9effb,#dae6fa)}
.ghead h2{margin:0;font-size:21px;font-weight:800}
.ghead p{margin:3px 0 0;font-size:12.5px;color:var(--mut);line-height:1.7}
.gsteps{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.gstep{font-size:11.5px;font-weight:700;color:#5a6a8f;background:#f4f7fd;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.fld{margin:17px 0 0}
.flabel{display:block;font-size:13px;font-weight:700;color:#33405c;margin-bottom:8px}
.flabel em{color:#c62828;font-style:normal;margin-left:2px}
.flabel i{font-style:normal;font-weight:400;color:#93a0b8;font-size:11.5px;margin-left:7px}
.inp{width:100%;border:1px solid #d8deea;border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:#7f9dd6;box-shadow:0 0 0 3px rgba(90,130,200,.13)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b95a9 50%),linear-gradient(135deg,#8b95a9 50%,transparent 50%);
  background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid #d8deea;background:#fff;color:#3a4459;cursor:pointer;padding:8px 13px;border-radius:11px;
  font:inherit;font-size:13px;font-weight:600;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s;user-select:none}
.chip:hover{border-color:#9db4dd;transform:translateY(-1px)}
.chip.on{background:#2f4d86;border-color:#2f4d86;color:#fff;box-shadow:0 4px 12px rgba(47,77,134,.25)}
.chip.on::before{content:"✓ ";font-weight:800}
.gfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{appearance:none;border:none;cursor:pointer;font:inherit;font-weight:800;border-radius:12px;padding:12px 28px;font-size:14.5px;color:#fff;
  background:linear-gradient(135deg,#2f4d86,#1f6fb2);box-shadow:0 6px 18px rgba(31,111,178,.28);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(31,111,178,.34)}
.btn.ghost{background:#fff;color:#3a4459;border:1px solid #d8deea;box-shadow:none;font-weight:700;padding:10px 18px;font-size:13px}
.btn.ghost:hover{border-color:#9db4dd;box-shadow:0 4px 12px rgba(25,40,80,.10)}
.gerr{color:#c62828;font-size:12.5px;font-weight:700}
.gph{background:#f7f9ff;border:1px dashed #c6d0e6;border-radius:14px;padding:18px;text-align:center;color:#6b7692;font-size:13px;line-height:1.9}
.gph b{color:#2f4d86}

/* 结果 */
.rsum{background:linear-gradient(135deg,#f2f7ff,#edf2fe);border:1px solid #dbe5f8;border-radius:16px;padding:16px 20px}
.rsum h3{margin:0 0 6px;font-size:16px;color:#22315a}
.rsum p{margin:0;font-size:13px;color:#48567a;line-height:1.9}
.rsum b{color:#b03a2e}
.rsum .pf{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rsum .pf span{font-size:11.5px;font-weight:700;color:#3d4d72;background:#fff;border:1px solid #dde5f3;border-radius:999px;padding:3px 10px}
.bchart{margin:14px 0 2px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.bchart .bt{font-size:12px;font-weight:800;color:#4d5872;margin-bottom:8px;letter-spacing:.4px}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0}
.bnm{flex:none;width:200px;font-size:12px;color:#3a4459;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{flex:1;height:12px;border-radius:999px;background:#eef1f7;overflow:hidden}
.btrack i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.bval{flex:none;width:46px;text-align:right;font-size:12px;font-weight:800;color:#5a6a8f}
@media (max-width:640px){.bnm{width:118px;font-size:11px}}
.rmatch{background:#fff;border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:16px;padding:14px 18px;margin:12px 0;box-shadow:0 3px 12px rgba(20,40,80,.05)}
.rmh{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.rank{flex:none;width:29px;height:29px;border-radius:50%;background:var(--cc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rmh h4{margin:0;font-size:16.5px;font-weight:800;color:#1f2840}
.rmh .rtag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;background:var(--cc);white-space:nowrap}
.level{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.score{margin-left:auto;text-align:right;flex:none}
.score .sv{font-size:22px;font-weight:800;color:var(--cc);line-height:1.05}
.score .sl{font-size:10.5px;color:#8b95a9;letter-spacing:.5px}
.bar{height:7px;border-radius:999px;background:#eef1f7;overflow:hidden;margin:10px 0 2px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--cc)}
.rmeta{margin:8px 0 0;font-size:11.5px;color:#8b95a9}
.rwhy{margin-top:9px;font-size:13px;color:#33405c;line-height:1.85}
.rwhy .lb{font-weight:800;color:#2f4d86}
.rnote{margin-top:9px;font-size:12.5px;color:#5c4a3c;background:#fdf9f5;border:1px solid #f0e3d8;border-left:4px solid #d9a441;
  border-radius:0 10px 10px 0;padding:9px 12px;line-height:1.85}
.rnote .lb{font-weight:800;color:#8a5a2a}
.rnote ul{margin:4px 0 0;padding-left:17px}
.rnote li{margin:2px 0}

/* ---------- 页脚 ---------- */
footer.foot{margin-top:30px;padding-top:16px;border-top:1px solid #d9dfeb;color:#8b95a9;font-size:11.5px;line-height:1.9;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mastl">
      <div class="kick">政策资金研究 · 依据政策原文与官方口径提炼</div>
      <h1>城市更新 · <b>五大政策资金渠道</b>图谱</h1>
      <p class="lead">从「钱从哪来」出发——<b>主管部门 · 支持范围 · 支持金额 · 资金特点 · 项目要求</b>，政策要点已全部展开，顶部标签一键切换。</p>
    </div>
    <div class="mastr"><span><b>5</b> 大渠道</span><span><b>11</b> 份政策原文</span><span><b>1</b> 张组合对比</span><span><b>1</b> 个项目匹配工具</span></div>
  </header>
  <nav id="tabs" class="pills" aria-label="资金渠道切换"></nav>
  <main id="views"></main>
  <footer class="foot">
    注：内容依据「城市更新政策资金研究」文件夹内政策原文与研究报告提炼，截至 2026-06 国新办政策吹风会口径；其中《发改投资〔2025〕358号》解读与《财综〔2024〕15号》为扫描原件，已逐页识别核对。仅供内部研究参考。
  </footer>
</div>
<script>


/* ================= 数据 ================= */

/* ---------- 基础工具 ---------- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 允许原文中少数 <b>…</b> 强调标签
function h(s) {
  return esc(s)
    .replace(/&lt;b&gt;/gi, '<b>').replace(/&lt;\/b&gt;/gi, '</b>')
    .replace(/&lt;i&gt;/gi, '<i>').replace(/&lt;\/i&gt;/gi, '</i>');
}
function esc2br(s) { return h(s).replace(/\n+/g, '<br/>'); }
const a = (hex, aa) => String(hex) + aa; // #rrggbb + 2位透明度

/* ---------- 五维元信息 ---------- */
function dm(label) {
  const L = String(label || '');
  if (L.indexOf('主管') > -1) return { k: 'dept', n: '主管部门', ic: '🏛️' };
  if (L.indexOf('范围') > -1) return { k: 'scope', n: '支持范围', ic: '🎯' };
  if (L.indexOf('金额') > -1 || L.indexOf('标准') > -1) return { k: 'amt', n: '支持金额与标准', ic: '💰' };
  if (L.indexOf('特点') > -1) return { k: 'feat', n: '资金支持特点', ic: '🧭' };
  if (L.indexOf('要求') > -1) return { k: 'req', n: '对项目要求', ic: '📋' };
  if (L.indexOf('流程') > -1) return { k: 'opt', n: '申报流程', ic: '📌' };
  return { k: 'opt', n: '其他要点', ic: '📄' };
}

/* ---------- 总览 hub SVG ---------- */
function hubSVG() {
  const cx = 350, cy = 168, R = 128, N = 5;
  const pts = CATS.map((c, i) => {
    const rad = (-90 + i * (360 / N)) * Math.PI / 180;
    return { c, x: cx + R * Math.cos(rad), y: cy + R * Math.sin(rad) };
  });
  const lines = pts.map(p =>
    `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${p.c.color}" stroke-opacity=".30" stroke-width="2.5"/>`
  ).join('');
  const nodes = pts.map(p => {
    const c = p.c;
    const mini = String(c.mini || '').replace(/<[^>]*>/g, '');
    const sm = mini.length > 10 ? mini.slice(0, 10) + '…' : mini;
    return `<g>
      <rect x="${p.x - 78}" y="${p.y - 27}" width="156" height="54" rx="15" fill="#ffffff" stroke="${c.color}" stroke-width="1.6"/>
      <text x="${p.x - 66}" y="${p.y + 8}" font-size="23" text-anchor="middle">${c.icon}</text>
      <text x="${p.x - 40}" y="${p.y + 2}" font-size="13.5" font-weight="800" fill="#2a3350">${esc(c.name)}</text>
      <text x="${p.x - 40}" y="${p.y + 18}" font-size="10" fill="#7b8498">${esc(sm)}</text>
    </g>`;
  }).join('');
  const city = `<circle cx="${cx}" cy="${cy}" r="38" fill="#ffffff" stroke="#c6d0e4" stroke-width="1.6"/>
    <text x="${cx}" y="${cy + 12}" font-size="28" text-anchor="middle">🏙️</text>
    <text x="${cx}" y="${cy - 52}" font-size="11.5" font-weight="800" fill="#4a5f8f" text-anchor="middle" letter-spacing="1">城市更新 · 具体项目</text>`;
  return `<svg viewBox="0 0 700 336" role="img" aria-label="五渠汇流示意"><g>${lines}${nodes}${city}</g></svg>`;
}

/* ---------- 资金直达路径 ---------- */
function flowHTML(k, color) {
  const r = ROUTES.find(x => x.key === k);
  const nodes = (r && r.nodes) || [];
  if (!nodes.length) return '';
  const items = nodes.map((n, i) => {
    const last = i === nodes.length - 1;
    const st = last ? ` style="background:${color};border-color:${color}"` : '';
    return `<div class="fnode${last ? ' fin' : ''}"${st}>${h(n)}</div>`;
  }).join('<span class="farr">→</span>');
  return `<div class="flowcap">💧 资金直达路径</div><div class="flow">${items}</div>`;
}

/* ---------- 政策卡（默认全展开） ---------- */
function cardHTML(p, color) {
  const kws = (p.kw && p.kw.length)
    ? `<div class="kws">${p.kw.map(k => `<span class="kw" style="color:${color};background:${a(color, '0e')}">${h(k)}</span>`).join('')}</div>`
    : '';
  const cells = (p.rows || []).map(r => {
    const m = dm(r[0]);
    return `<div class="dim d-${m.k}"><div class="dh"><span class="i2">${m.ic}</span>${m.n}</div>
      <div class="dc">${esc2br(r[1])}</div></div>`;
  }).join('');
  const amt = p.amt
    ? `<div class="pamt" style="background:${a(color, '0b')};border:1px solid ${a(color, '30')}">
        <span class="lbl">资金规模 · 标准</span>
        <span class="big" style="color:${color}">${h(p.amt)}</span>
       </div>`
    : '';
  const note = p.note
    ? `<div class="pnote" style="--cc:${color}"><span class="lb">📎 补充说明</span><br/>${h(p.note)}</div>`
    : '';
  return `<section class="pc"><div class="pch">
      <div class="pico" style="background:${a(color, '10')}">${p.ic || '📄'}</div>
      <div class="ptxt"><h3>${h(p.name)}</h3>${p.num ? `<span class="num">${h(p.num)}</span>` : ''}
        <p class="off">${h(p.off || '')}</p>${kws}</div>
      ${amt}
    </div>
    <div class="rows">${cells}</div>${note}</section>`;
}

/* ---------- 渠道页 ---------- */
function buildChannel(k) {
  const c = CH[k];
  const facts = c.fact.map(f =>
    `<div class="fact"><span class="fk">${esc(f[0])}</span><span class="fv">${h(f[1])}</span></div>`
  ).join('');
  const band = `<header class="cband" style="--cc:${c.color}">
    <div class="cbicon" style="background:${a(c.color, '10')}">${c.icon}</div>
    <div class="cbt"><h2>${esc(c.name)}</h2><p class="ctag">${h(c.tag || '')}</p></div>
    ${c.mini ? `<div class="cbmini" style="border:1px solid ${a(c.color, '35')};color:${c.color}">${esc(c.mini)}</div>` : ''}
  </header>`;
  const sub = c.subtitle ? `<div class="csub">${h(c.subtitle)}</div>` : '';
  let body;
  if (c.groups && c.groups.length) {
    body = c.groups.map(g => {
      const pols = (c.policies || []).filter(p => p.g === g.g);
      if (!pols.length) return '';
      return `<div class="grib" style="--cc:${c.color}"><span class="gb">${esc(g.idx || '·')}</span>
        <div class="gtx"><b>${h(g.name)}</b>${g.tag ? `<span class="gt">${h(g.tag)}</span>` : ''}</div>
        <span class="gcount">${pols.length} 份政策 / 口径</span></div>` +
        pols.map(p => cardHTML(p, c.color)).join('');
    }).join('');
  } else {
    body = (c.policies || []).map(p => cardHTML(p, c.color)).join('');
    if (!body) body = '<div class="tip">本渠道暂无独立拆分卡片，请参见上方要点与路径。</div>';
  }
  return band + sub + `<div class="facts" style="--cc:${c.color}">${facts}</div>` + flowHTML(k, c.color) + body;
}

/* 打分与排序 */
function scoreProject(pf) {
  const list = G_CAND.map(function (c) {
    const r = c.ev(pf) || {};
    const s = Math.max(0, Math.min(100, Math.round(r.score || 0)));
    return { key:c.key, name:c.name, cat:c.cat, catN:c.catN, num:c.num, amt:c.amt, color:GC[c.cat] || '#46536b',
      score:s, why:(r.why || []), notes:(r.notes || []) };
  });
  list.sort(function (x, y) { return y.score - x.score; });
  return list;
}

/* ---------- 结果渲染 ---------- */
const G_LEVEL = function (s) {
  if (s >= 72) return { t:'高匹配', c:'#2e7d32', bg:'#e8f5ec' };
  if (s >= 52) return { t:'中匹配', c:'#b7791f', bg:'#fdf4e3' };
  return { t:'较低匹配', c:'#7d8798', bg:'#f1f3f7' };
};
function renderResult(pf, list) {
  const top = list[0];
  const typeNames = G_TYPE.filter(function (t) { return pf.types.has(t.k); }).map(function (t) { return t.n; });
  const level = G_LEVEL(top.score).t;
  const strong = list.filter(function (x) { return x.score >= 52; });
  const combos = strong.filter(function (x) { return x.key !== top.key; }).slice(0, 2);

  const pfChips = ['项目类型：' + typeNames.join('、'),
    '区域：' + LBL(G_OPT.region, pf.region),
    '规模：' + LBL(G_OPT.citySize, pf.citySize),
    '收益属性：' + LBL(G_OPT.nature, pf.nature),
    '阶段：' + LBL(G_OPT.stage, pf.stage)].filter(function (x) { return x.indexOf('：') < x.length - 1; })
    .map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');

  const summary = '<div class="rsum"><h3>📊 匹配评估结果' + (pf.name ? ' · ' + esc(pf.name) : '') + '</h3>' +
    '<p>' + (top.score >= 52
      ? '根据项目画像，综合匹配分析：最适配的资金渠道为 <b>' + esc(top.name) + '</b>（匹配度 <b>' + top.score + '%</b>，' + level + '）。'
      : '根据项目画像，暂未出现高度适配的资金渠道；相对最接近的是 <b>' + esc(top.name) + '</b>（匹配度 <b>' + top.score + '%</b>）。请重点查看下表的<b>注意事项</b>，按提示补齐条件或调整申报方向。') +
    (combos.length ? '建议以其为主渠道，并按下表组合 ' + combos.map(function (c) { return '「' + esc(c.name) + '」'; }).join('、') + ' 作为补充。' : '') +
    ' 下方为全部 ' + list.length + ' 个资金渠道的匹配度排序。</p>' +
    '<div class="pf">' + pfChips + '</div></div>';

  const chart = '<div class="bchart"><div class="bt">📈 各资金渠道匹配度</div>' + list.map(function (x) {
    return '<div class="brow"><span class="bnm" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
      '<span class="btrack"><i style="width:' + x.score + '%;background:' + x.color + '"></i></span>' +
      '<b class="bval">' + x.score + '%</b></div>';
  }).join('') + '</div>';

  const cards = list.map(function (x, i) {
    const lv = G_LEVEL(x.score);
    const whyTxt = x.why.length ? x.why.map(esc).join('；') : '与渠道的支持范围或申报条件重叠较少，匹配度偏低。';
    const cap = x.score >= 52 ? 4 : 3;
    const noteHtml = x.notes.length
      ? '<div class="rnote"><span class="lb">⚠️ 注意事项</span><ul>' + x.notes.slice(0, cap).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>'
      : '';
    return '<div class="rmatch" style="--cc:' + x.color + '">' +
      '<div class="rmh"><span class="rank">' + (i + 1) + '</span>' +
      '<h4>' + esc(x.name) + '</h4>' +
      '<span class="rtag">' + esc(x.catN) + '</span>' +
      '<span class="level" style="color:' + lv.c + ';background:' + lv.bg + '">' + lv.t + '</span>' +
      '<span class="score"><span class="sv">' + x.score + '%</span><span class="sl">匹配度</span></span></div>' +
      '<div class="bar"><i style="width:' + x.score + '%"></i></div>' +
      '<p class="rmeta">' + (x.num ? esc(x.num) + ' · ' : '') + (x.amt ? '资金规模/标准：' + esc(x.amt) : '') + '</p>' +
      '<div class="rwhy"><span class="lb">✅ 为什么匹配：</span>' + whyTxt + '</div>' +
      noteHtml +
      '</div>';
  }).join('');

  /* 组合申报与全局提示 */
  const tips = [];
  tips.push('同一具体项目不得在不同中央资金渠道重复申报；中央财政、中央预算内投资、超长期特别国债之间须做好衔接、避免交叉安排。');
  tips.push('「补助/债券（资本性资金）」与「长周期贷款（债务性资金）」可按项目实际组合使用，贷款用于补充建设资金。');
  const has = function (k) { return list.some(function (x) { return x.key === k && x.score >= 52; }); };
  if (has('bond') && has('policyfin')) { tips.push('✅ 地方政府专项债券 与 新型政策性金融工具 可拼盘使用，共同解决资本金与建设资金缺口。'); }
  if (has('lz') && has('policyfin')) { tips.push('⚠️ 新型政策性金融工具 与 超长期特别国债 不可对同一项目拼盘，二者请择一申报。'); }
  if (pf.nature === 'public') { tips.push('⚠️ 纯公益性项目不宜单独依赖专项债券与商业贷款，建议以中央预算内投资/中央财政补助为主，缺口由财政资金统筹保障。'); }
  if (pf.stage === 'done') { tips.push('⚠️ 当前选择「已完工」——绝大多数渠道不支持已完工项目，请核对项目状态。'); }
  if (pf.types.has('village')) { tips.push('⚠️ 城中村改造专项借款（建保〔2023〕80号）政策窗口正在收窄——国家已不再组织第三批申报，请勿以其作为主要资金来源。'); }
  tips.push('所有渠道的共同门槛：项目成熟、年内可开工、前期手续齐备、绩效达标；转移支付类资金不得用于平衡预算或偿还存量债务。');
  const combo = '<div class="card maxtips"><h4>🧩 组合申报与通用提示</h4><ul>' +
    tips.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';

  const again = '<div style="text-align:center;margin-top:8px"><button type="button" class="btn ghost" data-act="again">↺ 重新评估</button></div>';

  return summary + chart + cards + combo + again;
}

/* ---------- 交互 ---------- */
function guideCollect(form) {
  const v = function (n) { const el = form.querySelector('[name="' + n + '"]'); return el ? String(el.value || '').trim() : ''; };
  const types = new Set();
  form.querySelectorAll('#typeChips .chip.on').forEach(function (c) { types.add(c.dataset.type); });
  return {
    name: v('name'), region: v('region'), citySize: v('citySize'), nature: v('nature'),
    subject: v('subject'), stage: v('stage'), ready: v('ready') || 'mid',
    total: Number(v('total') || 0), gap: Number(v('gap') || 0), types: types
  };
}
function guideValidate(pf) {
  const miss = [];
  if (!pf.types.size) miss.push('项目类型（至少选 1 项）');
  if (!pf.region) miss.push('所在区域');
  if (!pf.citySize) miss.push('城市规模');
  if (!pf.nature) miss.push('项目收益属性');
  if (!pf.subject) miss.push('实施主体');
  if (!pf.stage) miss.push('项目阶段');
  return miss;
}
function guideRun() {
  const form = document.getElementById('guideForm');
  if (!form) return;
  const pf = guideCollect(form);
  const errEl = document.getElementById('guideErr');
  const miss = guideValidate(pf);
  if (miss.length) {
    if (errEl) errEl.textContent = '⚠️ 请补充：' + miss.join('、');
    const box0 = document.getElementById('guideResult');
    if (box0) box0.innerHTML = '<div class="gph">📌 还差几项必填信息（' + esc(miss.join('、')) + '），补齐后即可生成匹配结果。</div>';
    return;
  }
  if (errEl) errEl.textContent = '';
  const list = scoreProject(pf);
  const box = document.getElementById('guideResult');
  box.innerHTML = renderResult(pf, list);
  box.scrollIntoView({ behavior:'smooth', block:'start' });
}
function guideDemo() {
  const form = document.getElementById('guideForm');
  if (!form) return;
  form.querySelector('[name="name"]').value = '示例：XX市老城区老旧小区与管网综合改造项目';
  form.querySelector('[name="region"]').value = 'central';
  form.querySelector('[name="citySize"]').value = 'big';
  form.querySelector('[name="nature"]').value = 'quasi';
  form.querySelector('[name="subject"]').value = 'platform';
  form.querySelector('[name="stage"]').value = 'approved';
  form.querySelector('[name="ready"]').value = 'high';
  form.querySelector('[name="total"]').value = '32000';
  form.querySelector('[name="gap"]').value = '14000';
  form.querySelectorAll('#typeChips .chip').forEach(function (c) {
    c.classList.toggle('on', ['oldc','pipe','community'].indexOf(c.dataset.type) > -1);
  });
  guideRun();
}
function initGuide() {
  const form = document.getElementById('guideForm');
  if (!form) return;
  form.querySelectorAll('#typeChips .chip').forEach(function (c) {
    c.addEventListener('click', function () { c.classList.toggle('on'); });
  });
  form.addEventListener('submit', function (e) { e.preventDefault(); guideRun(); });
  form.addEventListener('reset', function () {
    setTimeout(function () {
      form.querySelectorAll('#typeChips .chip.on').forEach(function (c) { c.classList.remove('on'); });
      const errEl = document.getElementById('guideErr'); if (errEl) errEl.textContent = '';
      const box = document.getElementById('guideResult');
      if (box) box.innerHTML = '<div class="gph">📌 填写上方信息后点击「一键匹配」，这里会列出<b>最适合您项目的资金渠道排序</b>。</div>';
    }, 0);
  });
  const dm2 = document.getElementById('guideDemo');
  if (dm2) dm2.addEventListener('click', guideDemo);
  const box = document.getElementById('guideResult');
  if (box) box.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act="again"]');
    if (b) { document.getElementById('guideForm').scrollIntoView({ behavior:'smooth', block:'start' }); }
  });
}

/* ---------- 组装与交互 ---------- */
const NAV = [['overview', '🏠', '总览'], ['guide', '📍', '项目申报指引']]
  .concat(CATS.map(c => [c.key, c.icon, c.name]))
  .concat([['matrix', '🗂️', '横向对比']]);
const navColor = k => (k === 'overview' || k === 'matrix') ? '#46536b' : (k === 'guide' ? '#2f4d86' : CH[k].color);

const viewsEl = document.getElementById('views');
const tabsEl = document.getElementById('tabs');

let all = '';
all += `<section class="view" id="view-overview">${buildOverview()}</section>`;
all += `<section class="view" id="view-guide">${buildGuide()}</section>`;
CATS.forEach(c => { all += `<section class="view" id="view-${c.key}">${buildChannel(c.key)}</section>`; });
all += `<section class="view" id="view-matrix">${buildMatrix()}</section>`;
viewsEl.innerHTML = all;
initGuide();

tabsEl.innerHTML = NAV.map(n =>
  `<button type="button" class="pill" data-v="${n[0]}" data-c="${navColor(n[0])}">${n[1]}&nbsp;${esc(n[2])}</button>`
).join('');

function go(v) {
  const valid = NAV.some(n => n[0] === v);
  if (!valid) v = 'overview';
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
  tabsEl.querySelectorAll('.pill').forEach(b => {
    const on = b.dataset.v === v;
    b.classList.toggle('on', on);
    b.style.background = on ? b.dataset.c : '';
    b.style.borderColor = on ? b.dataset.c : '';
  });
  window.scrollTo({ top: 0, behavior: 'auto' });
}
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (b) go(b.dataset.v);
});
go('overview');

try { window.__t = { go: go }; } catch (e) { /* ignore */ }

</script>
